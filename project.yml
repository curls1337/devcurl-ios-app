name: NikAI
options:
  bundleIdPrefix: com.nik.voice
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
targets:
  NikAI:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: DevCurlAI
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: Speech.framework
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.nik.voice.ai
      INFOPLIST_FILE: DevCurlAI/Info.plist
      MARKETING_VERSION: "2.5.0"
      CURRENT_PROJECT_VERSION: "5"
      SWIFT_VERSION: "5.0"
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGN_IDENTITY: ""
      DEVELOPMENT_TEAM: ""
