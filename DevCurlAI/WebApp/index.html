<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DevCurl AI</title>
  <!-- Apple Native Web App Capabilities -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DevCurl AI">
  <meta name="theme-color" content="#000000">

  <!-- Lucide Icons & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    :root {
      --bg-canvas: #000000;
      --bg-surface: #12141a;
      --bg-surface-elevated: #1a1e28;
      --bg-input: #1a1e28;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.16);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --ios-blue: #007aff;
      --ios-blue-gradient: linear-gradient(135deg, #007aff 0%, #0056cb 100%);
      --accent-cyan: #06b6d4;
      --accent-purple: #a855f7;
      --accent-emerald: #10b981;
      --safe-top: env(safe-area-inset-top, 24px);
      --safe-bottom: env(safe-area-inset-bottom, 24px);
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'SF Pro Text', system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* =========================================================================
       1. TOP NAVIGATION BAR (ChatGPT / Apple HIG Style)
       ========================================================================= */
    .ios-navbar {
      padding-top: var(--safe-top);
      background: rgba(18, 20, 26, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-bottom: 0.5px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      z-index: 100;
      flex-shrink: 0;
    }

    .nav-content {
      height: 48px;
      padding: 0 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .nav-icon-btn:active {
      background: rgba(255, 255, 255, 0.12);
    }

    /* Agent Dropdown Pill */
    .agent-selector-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .agent-selector-pill:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.14);
    }
    .agent-avatar-mini {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }
    .agent-name-label {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
    }

    /* =========================================================================
       2. CHAT STREAM AREA
       ========================================================================= */
    .chat-stream-container {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 1rem 1rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Welcome Hero Banner (Shown when chat is empty) */
    .welcome-hero {
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem 1rem;
      gap: 1rem;
    }
    .hero-orb {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #06b6d4 0%, #a855f7 50%, #ec4899 100%);
      box-shadow: 0 0 35px rgba(6, 182, 212, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      animation: floatHero 3s infinite ease-in-out;
    }
    @keyframes floatHero {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .hero-title {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #ffffff;
    }
    .hero-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      max-width: 290px;
      line-height: 1.5;
    }

    /* Starter Prompt Chips */
    .starter-chips {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      width: 100%;
      max-width: 320px;
      margin-top: 0.5rem;
    }
    .starter-chip-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 0.7rem 0.9rem;
      color: #cbd5e1;
      font-size: 0.78rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
    }
    .starter-chip-btn:active {
      transform: scale(0.98);
      background: var(--bg-surface-elevated);
      border-color: var(--accent-cyan);
    }

    /* Message Rows */
    .message-row {
      display: flex;
      flex-direction: column;
      width: 100%;
      animation: fadeInMsg 0.25s ease-out;
    }
    @keyframes fadeInMsg {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-row.user {
      align-items: flex-end;
    }
    .message-row.assistant {
      align-items: flex-start;
    }

    .message-bubble {
      max-width: 86%;
      padding: 0.85rem 1.05rem;
      border-radius: 20px;
      font-size: 0.88rem;
      line-height: 1.55;
      word-break: break-word;
    }

    .message-row.user .message-bubble {
      background: var(--ios-blue-gradient);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 14px rgba(0, 122, 255, 0.35);
    }

    .message-row.assistant .message-bubble {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: #f1f5f9;
      border-bottom-left-radius: 4px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    /* Markdown styling inside assistant bubble */
    .message-bubble h1, .message-bubble h2, .message-bubble h3 {
      font-size: 0.96rem;
      font-weight: 800;
      margin: 0.6rem 0 0.3rem;
      color: #ffffff;
    }
    .message-bubble p {
      margin-bottom: 0.5rem;
    }
    .message-bubble p:last-child {
      margin-bottom: 0;
    }
    .message-bubble ul, .message-bubble ol {
      margin-left: 1.2rem;
      margin-bottom: 0.5rem;
    }
    .message-bubble code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      background: rgba(0, 0, 0, 0.35);
      padding: 2px 5px;
      border-radius: 4px;
      color: #38bdf8;
    }
    .message-bubble pre {
      background: #080c16;
      border: 1px solid var(--border-subtle);
      padding: 0.75rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 0.5rem 0;
    }
    .message-bubble pre code {
      background: transparent;
      padding: 0;
      color: #e2e8f0;
    }

    .agent-header-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    /* Typing Indicator */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0.6rem 0.9rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      width: fit-content;
      margin-bottom: 0.5rem;
    }
    .typing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-cyan);
      animation: typingBounce 1.4s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    /* =========================================================================
       3. BOTTOM FLOATING INPUT BAR (iOS Native Style)
       ========================================================================= */
    .ios-input-cluster {
      padding: 0.5rem 0.85rem var(--safe-bottom);
      background: rgba(18, 20, 26, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-top: 0.5px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex-shrink: 0;
      z-index: 100;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      background: var(--bg-input);
      border: 1px solid var(--border-medium);
      border-radius: 24px;
      padding: 4px 6px 4px 14px;
      transition: border-color 0.2s ease;
    }
    .input-row:focus-within {
      border-color: rgba(56, 189, 248, 0.5);
    }

    .chat-textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.92rem;
      line-height: 1.4;
      resize: none;
      max-height: 120px;
      min-height: 24px;
      padding: 6px 0;
    }
    .chat-textarea::placeholder {
      color: var(--text-dim);
    }

    .send-icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #ffffff;
      color: #000000;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .send-icon-btn:disabled {
      background: rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.4);
      cursor: not-allowed;
    }
    .send-icon-btn:not(:disabled):active {
      transform: scale(0.92);
      background: #e2e8f0;
    }

    /* =========================================================================
       4. SLIDING DRAWER / SIDEBAR (Chats History & Agent List)
       ========================================================================= */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-sheet {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 82%;
      max-width: 320px;
      background: #0d1017;
      border-right: 0.5px solid var(--border-subtle);
      z-index: 201;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }
    .drawer-sheet.open {
      transform: translateX(0);
    }

    .drawer-header {
      padding: 1rem 1.25rem;
      border-bottom: 0.5px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .drawer-title {
      font-size: 1rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .drawer-section {
      padding: 1rem 1.25rem 0.5rem;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .drawer-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .drawer-item {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.7rem 0.85rem;
      border-radius: 12px;
      color: #cbd5e1;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .drawer-item:active, .drawer-item.active {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }
    .drawer-item.active {
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .drawer-footer {
      padding: 1rem 1.25rem;
      border-top: 0.5px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    /* Modal Sheet for Agent Selection */
    .sheet-modal {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #121622;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      border-top: 1px solid var(--border-medium);
      padding: 1.2rem 1.25rem var(--safe-bottom);
      z-index: 250;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
      box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .sheet-modal.open {
      transform: translateY(0);
    }
    .sheet-handle {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.25);
      margin: 0 auto 0.4rem;
    }
    .sheet-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
      max-height: 50vh;
      overflow-y: auto;
    }
    .sheet-agent-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .sheet-agent-card:active, .sheet-agent-card.active {
      background: rgba(6, 182, 212, 0.15);
      border-color: var(--accent-cyan);
    }
  </style>
</head>
<body>

  <!-- =======================================================================
       1. SLIDING SESSIONS DRAWER
       ======================================================================= -->
  <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
  <aside class="drawer-sheet" id="drawer-sheet">
    <div class="drawer-header">
      <div class="drawer-title">
        <i data-lucide="terminal" style="width: 18px; height: 18px; color: var(--accent-cyan);"></i>
        <span>DevCurl AI</span>
      </div>
      <button class="nav-icon-btn" onclick="closeDrawer()">
        <i data-lucide="x" style="width: 20px; height: 20px;"></i>
      </button>
    </div>

    <!-- New Chat Primary Action -->
    <div style="padding: 0.85rem 0.75rem 0.4rem;">
      <button class="starter-chip-btn" onclick="startNewChat(); closeDrawer();" style="width: 100%; background: linear-gradient(135deg, #0284c7, #06b6d4); color: #ffffff; border: none; font-weight: 800;">
        <span style="display: flex; align-items: center; gap: 8px;">
          <i data-lucide="plus" style="width: 16px; height: 16px;"></i>
          <span>Percakapan Baru</span>
        </span>
      </button>
    </div>

    <div class="drawer-section">Riwayat Percakapan</div>
    <div class="drawer-list" id="sessions-list">
      <!-- Session items will be dynamically rendered here -->
    </div>

    <div class="drawer-footer">
      <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.72rem; color: var(--text-muted);">
        <span>Server LAN</span>
        <span style="color: var(--accent-emerald); font-weight: 700;">192.168.18.200:8080</span>
      </div>
    </div>
  </aside>

  <!-- =======================================================================
       2. TOP iOS NAVBAR
       ======================================================================= -->
  <nav class="ios-navbar">
    <div class="nav-content">
      <!-- Left: Sidebar Drawer Trigger -->
      <button class="nav-icon-btn" onclick="openDrawer()">
        <i data-lucide="menu" style="width: 22px; height: 22px;"></i>
      </button>

      <!-- Center: Active Agent Selector Pill -->
      <div class="agent-selector-pill" onclick="openAgentModal()">
        <div class="agent-avatar-mini" id="current-agent-icon">🐧</div>
        <span class="agent-name-label" id="current-agent-name">Ubuntu Admin</span>
        <i data-lucide="chevron-down" style="width: 14px; height: 14px; color: var(--text-muted);"></i>
      </div>

      <!-- Right: New Chat Shortcut -->
      <button class="nav-icon-btn" onclick="startNewChat()" title="Chat Baru">
        <i data-lucide="square-pen" style="width: 20px; height: 20px;"></i>
      </button>
    </div>
  </nav>

  <!-- =======================================================================
       3. CHAT STREAM
       ======================================================================= -->
  <main class="chat-stream-container" id="chat-stream">
    <div class="welcome-hero" id="welcome-hero">
      <div class="hero-orb">
        <i data-lucide="sparkles" style="width: 32px; height: 32px;"></i>
      </div>
      <div>
        <h1 class="hero-title">DevCurl AI Studio</h1>
        <p class="hero-subtitle">Asisten otonom pribadi Pak cURLdev. Siap kelola server, bangun aplikasi, dan diskusikan ide produk.</p>
      </div>

      <div class="starter-chips">
        <button class="starter-chip-btn" onclick="quickSend('Halo, bagaimana status server Linux dan service saat ini?')">
          <span>📊 Status Server &amp; RAM</span>
          <i data-lucide="arrow-right" style="width: 14px; height: 14px;"></i>
        </button>
        <button class="starter-chip-btn" onclick="quickSend('Saya ingin membuat aplikasi kasir offline-first, bantu rancang konsepnya.')">
          <span>📦 Rancang Aplikasi Baru</span>
          <i data-lucide="arrow-right" style="width: 14px; height: 14px;"></i>
        </button>
        <button class="starter-chip-btn" onclick="quickSend('Tanya UI/UX Designer dan Frontend Developer, bagaimana konsep antarmuka mobile kita?')">
          <span>🎨 Diskusi Tim Multi-Agent</span>
          <i data-lucide="arrow-right" style="width: 14px; height: 14px;"></i>
        </button>
      </div>
    </div>
  </main>

  <!-- =======================================================================
       4. BOTTOM INPUT BAR
       ======================================================================= -->
  <footer class="ios-input-cluster">
    <div class="input-row">
      <textarea
        class="chat-textarea"
        id="chat-input"
        placeholder="Kirim pesan ke Hermes..."
        rows="1"
        oninput="autoResizeTextarea(this)"
        onkeydown="handleKeyDown(event)"
      ></textarea>
      <button class="send-icon-btn" id="send-btn" onclick="submitMessage()" disabled>
        <i data-lucide="arrow-up" style="width: 18px; height: 18px; stroke-width: 2.8;"></i>
      </button>
    </div>
  </footer>

  <!-- =======================================================================
       5. BOTTOM SHEET MODAL (AGENT PICKER)
       ======================================================================= -->
  <div class="drawer-overlay" id="sheet-overlay" onclick="closeAgentModal()"></div>
  <div class="sheet-modal" id="agent-sheet">
    <div class="sheet-handle"></div>
    <div style="font-size: 0.92rem; font-weight: 800; color: #ffffff; text-align: center;">Pilih Agen Spesialis</div>
    <div class="sheet-grid" id="agent-cards-grid">
      <!-- Agent selection cards dynamically generated -->
    </div>
  </div>

  <script>
    // =========================================================================
    // MULTI-AGENT PROFILES DATA
    // =========================================================================
    const AGENTS = [
      { id: 'ubuntu-admin', name: 'Ubuntu Admin', icon: '🐧', role: 'Root & Server Controller', color: '#e95420' },
      { id: 'product-manager', name: 'Product Manager', icon: '📦', role: 'PRD & Backlog MVP', color: '#8b5cf6' },
      { id: 'ui-ux-designer', name: 'UI/UX Designer', icon: '🎨', role: 'Liquid Glass & Design', color: '#f43f5e' },
      { id: 'frontend-developer', name: 'Frontend Dev', icon: '💻', role: 'React SPA & iOS IPA', color: '#f97316' },
      { id: 'backend-developer', name: 'Backend Dev', icon: '⚙️', role: 'APIs & SQLite Database', color: '#3b82f6' },
      { id: 'solution-architect', name: 'Architect', icon: '🏗️', role: 'System & Security', color: '#a855f7' },
      { id: 'qa-security', name: 'QA & Security', icon: '🛡️', role: 'Testing & OWASP Audit', color: '#eab308' },
      { id: 'all', name: 'Semua Agen', icon: '👥', role: 'Roundtable Discussion', color: '#06b6d4' }
    ];

    let currentAgent = AGENTS[0];
    let sessions = [];
    let currentSessionId = null;
    let isWaitingResponse = false;

    // Detect server API endpoint
    const API_BASE = window.location.origin.includes('8080') 
      ? window.location.origin 
      : 'http://192.168.18.200:8080';

    // =========================================================================
    // INITIALIZATION & STATE
    // =========================================================================
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadSessionsFromStorage();
      renderAgentModalCards();

      const input = document.getElementById('chat-input');
      input.addEventListener('input', () => {
        document.getElementById('send-btn').disabled = !input.value.trim() || isWaitingResponse;
      });
    });

    function loadSessionsFromStorage() {
      try {
        const stored = localStorage.getItem('devcurl_mobile_sessions');
        if (stored) {
          sessions = JSON.parse(stored);
        }
      } catch (e) {
        sessions = [];
      }

      if (!sessions || sessions.length === 0) {
        startNewChat(false);
      } else {
        currentSessionId = sessions[0].id;
        renderActiveSession();
      }
      renderSessionsList();
    }

    function saveSessionsToStorage() {
      try {
        localStorage.setItem('devcurl_mobile_sessions', JSON.stringify(sessions));
      } catch (e) {}
    }

    function startNewChat(save = true) {
      const newSession = {
        id: 'sess_' + Date.now(),
        title: 'Percakapan Baru',
        agentId: currentAgent.id,
        messages: [],
        timestamp: Date.now()
      };
      sessions.unshift(newSession);
      currentSessionId = newSession.id;
      if (save) saveSessionsToStorage();

      renderActiveSession();
      renderSessionsList();
      closeDrawer();
    }

    function renderActiveSession() {
      const stream = document.getElementById('chat-stream');
      const session = sessions.find(s => s.id === currentSessionId);
      if (!session) return;

      // Update current agent if saved in session
      if (session.agentId) {
        const a = AGENTS.find(item => item.id === session.agentId);
        if (a) setAgent(a, false);
      }

      if (!session.messages || session.messages.length === 0) {
        stream.innerHTML = `
          <div class="welcome-hero" id="welcome-hero">
            <div class="hero-orb">
              <i data-lucide="sparkles" style="width: 32px; height: 32px;"></i>
            </div>
            <div>
              <h1 class="hero-title">${currentAgent.name}</h1>
              <p class="hero-subtitle">${currentAgent.role}. Siap menerima arahan dan berdiskusi dengan Pak cURLdev.</p>
            </div>
            <div class="starter-chips">
              <button class="starter-chip-btn" onclick="quickSend('Halo ${currentAgent.name}, bagaimana status dan tugas Anda hari ini?')">
                <span>💬 Sapa &amp; Mulai Diskusi</span>
                <i data-lucide="arrow-right" style="width: 14px; height: 14px;"></i>
              </button>
            </div>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      stream.innerHTML = '';
      session.messages.forEach(msg => {
        appendMessageElement(msg.role, msg.content, msg.sender, false);
      });
      scrollStreamToBottom();
      lucide.createIcons();
    }

    function renderSessionsList() {
      const list = document.getElementById('sessions-list');
      list.innerHTML = '';
      sessions.forEach(s => {
        const item = document.createElement('div');
        item.className = 'drawer-item' + (s.id === currentSessionId ? ' active' : '');
        item.onclick = () => {
          currentSessionId = s.id;
          renderActiveSession();
          renderSessionsList();
          closeDrawer();
        };
        item.innerHTML = `
          <i data-lucide="message-square" style="width: 16px; height: 16px; flex-shrink: 0; color: var(--text-dim);"></i>
          <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${s.title}</span>
        `;
        list.appendChild(item);
      });
      lucide.createIcons();
    }

    // =========================================================================
    // MESSAGING & BACKEND INTEGRATION
    // =========================================================================
    async function submitMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || isWaitingResponse) return;

      input.value = '';
      input.style.height = '24px';
      document.getElementById('send-btn').disabled = true;

      // Hide Hero on first message
      const hero = document.getElementById('welcome-hero');
      if (hero) hero.remove();

      const session = sessions.find(s => s.id === currentSessionId);
      if (!session) return;

      // Update session title on first user turn
      if (session.messages.length === 0) {
        session.title = text.slice(0, 26) + (text.length > 26 ? '...' : '');
        renderSessionsList();
      }

      // Append User message
      session.messages.push({ role: 'user', content: text, sender: 'Pak cURLdev' });
      appendMessageElement('user', text, 'Pak cURLdev', true);
      saveSessionsToStorage();

      // Show Typing Indicator
      showTypingIndicator();
      isWaitingResponse = true;

      try {
        const res = await fetch(API_BASE + '/api/projects/discovery/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: session.messages.map(m => ({ role: m.role, content: m.content })),
            active_agent: currentAgent.id
          })
        });

        const data = await res.json();
        removeTypingIndicator();
        isWaitingResponse = false;

        const reply = data.reply || 'Instruksi diterima, Pak cURLdev.';
        const senderName = currentAgent.id === 'all' ? '👥 Hermes Multi-Agent' : currentAgent.icon + ' ' + currentAgent.name;

        session.messages.push({ role: 'assistant', content: reply, sender: senderName });
        appendMessageElement('assistant', reply, senderName, true);
        saveSessionsToStorage();
      } catch (err) {
        removeTypingIndicator();
        isWaitingResponse = false;
        const errMsg = 'Kendala koneksi ke server lokal: ' + err.message;
        appendMessageElement('assistant', errMsg, '⚠️ System Controller', true);
      }
    }

    function appendMessageElement(role, content, sender, scroll = true) {
      const stream = document.getElementById('chat-stream');
      const row = document.createElement('div');
      row.className = 'message-row ' + role;

      let formatted = escapeHtml(content)
        .replace(/### (.*?)\n/g, '<h3 style="font-size:0.92rem; font-weight:800; color:#38bdf8; margin:0.4rem 0;">$1</h3>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
        .replace(/\n/g, '<br>');

      row.innerHTML = `
        ${role === 'assistant' ? `<div class="agent-header-row"><span>${sender || 'Hermes'}</span></div>` : ''}
        <div class="message-bubble">${formatted}</div>
      `;

      stream.appendChild(row);
      if (scroll) scrollStreamToBottom();
    }

    function showTypingIndicator() {
      const stream = document.getElementById('chat-stream');
      const row = document.createElement('div');
      row.id = 'typing-indicator-row';
      row.className = 'message-row assistant';
      row.innerHTML = `
        <div class="agent-header-row"><span>${currentAgent.name} sedang berpikir...</span></div>
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      `;
      stream.appendChild(row);
      scrollStreamToBottom();
    }

    function removeTypingIndicator() {
      const el = document.getElementById('typing-indicator-row');
      if (el) el.remove();
    }

    function scrollStreamToBottom() {
      const stream = document.getElementById('chat-stream');
      stream.scrollTop = stream.scrollHeight;
    }

    function quickSend(text) {
      document.getElementById('chat-input').value = text;
      document.getElementById('send-btn').disabled = false;
      submitMessage();
    }

    function autoResizeTextarea(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitMessage();
      }
    }

    function escapeHtml(text) {
      return (text || '').replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // =========================================================================
    // UI CONTROLS & MODALS
    // =========================================================================
    function openDrawer() {
      document.getElementById('drawer-overlay').classList.add('open');
      document.getElementById('drawer-sheet').classList.add('open');
    }
    function closeDrawer() {
      document.getElementById('drawer-overlay').classList.remove('open');
      document.getElementById('drawer-sheet').classList.remove('open');
    }

    function openAgentModal() {
      document.getElementById('sheet-overlay').classList.add('open');
      document.getElementById('agent-sheet').classList.add('open');
    }
    function closeAgentModal() {
      document.getElementById('sheet-overlay').classList.remove('open');
      document.getElementById('agent-sheet').classList.remove('open');
    }

    function renderAgentModalCards() {
      const grid = document.getElementById('agent-cards-grid');
      grid.innerHTML = '';
      AGENTS.forEach(a => {
        const card = document.createElement('div');
        card.className = 'sheet-agent-card' + (a.id === currentAgent.id ? ' active' : '');
        card.onclick = () => {
          setAgent(a, true);
          closeAgentModal();
        };
        card.innerHTML = `
          <div style="font-size: 1.3rem;">${a.icon}</div>
          <div style="font-size: 0.8rem; font-weight: 800; color: #ffffff;">${a.name}</div>
          <div style="font-size: 0.65rem; color: var(--text-dim);">${a.role}</div>
        `;
        grid.appendChild(card);
      });
    }

    function setAgent(agent, updateSession = true) {
      currentAgent = agent;
      document.getElementById('current-agent-icon').textContent = agent.icon;
      document.getElementById('current-agent-name').textContent = agent.name;

      if (updateSession) {
        const session = sessions.find(s => s.id === currentSessionId);
        if (session) {
          session.agentId = agent.id;
          saveSessionsToStorage();
        }
      }
      renderAgentModalCards();
    }
  </script>
</body>
</html>
