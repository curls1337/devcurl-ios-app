<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DevCurl AI — Mobile Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: #030712;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 20px);
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
    header {
      padding: 0.85rem 1rem;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      font-size: 1rem;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981; }
    .channel-bar {
      padding: 0.5rem 0.85rem;
      background: #080d1a;
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 0.45rem;
      overflow-x: auto;
      white-space: nowrap;
    }
    .channel-bar::-webkit-scrollbar { display: none; }
    .pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: #94a3b8;
    }
    .pill.active {
      background: linear-gradient(135deg, #0284c7, #06b6d4);
      color: #ffffff;
      border-color: #38bdf8;
    }
    main {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .msg { max-width: 86%; display: flex; flex-direction: column; }
    .msg.user { align-self: flex-end; }
    .msg.agent { align-self: flex-start; }
    .sender { font-size: 0.62rem; font-weight: 800; color: #94a3b8; margin-bottom: 2px; }
    .bubble {
      padding: 0.75rem 0.95rem;
      border-radius: 16px;
      font-size: 0.84rem;
      line-height: 1.45;
    }
    .msg.user .bubble { background: #007aff; color: #ffffff; border-bottom-right-radius: 4px; }
    .msg.agent .bubble { background: #1e293b; color: #f1f5f9; border: 1px solid rgba(56, 189, 248, 0.25); border-bottom-left-radius: 4px; }
    footer {
      padding: 0.65rem 0.85rem;
      background: rgba(15, 23, 42, 0.95);
      border-top: 0.5px solid rgba(255, 255, 255, 0.12);
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    input {
      flex: 1;
      height: 38px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0 14px;
      font-size: 0.84rem;
      color: #ffffff;
      outline: none;
    }
    button {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #007aff;
      color: #ffffff;
      border: none;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span>DevCurl AI (iOS)</div>
    <span style="font-size: 0.65rem; color: #94a3b8;">192.168.18.200:8080</span>
  </header>
  <div class="channel-bar">
    <div class="pill active">👥 Semua Agen</div>
    <div class="pill">🐧 Ubuntu Admin</div>
    <div class="pill">📦 Product Manager</div>
    <div class="pill">🎨 UI/UX Designer</div>
    <div class="pill">💻 Frontend Dev</div>
  </div>
  <main id="chat">
    <div class="msg agent">
      <div class="sender">👥 Hermes Multi-Agent Studio</div>
      <div class="bubble">Halo Pak cURLdev! Selamat datang di aplikasi iPhone DevCurl AI. Seluruh agen saling terhubung dengan server Linux Anda.</div>
    </div>
  </main>
  <footer>
    <input type="text" id="inp" placeholder="Ketik pesan..." onkeydown="if(event.key==='Enter') send()">
    <button onclick="send()">➤</button>
  </footer>
  <script>
    const server = "http://192.168.18.200:8080";
    let hist = [];
    async function send() {
      const inp = document.getElementById('inp');
      const text = inp.value.trim();
      if (!text) return;
      inp.value = '';
      addMsg('👤 Pak cURLdev', text, 'user');
      hist.push({ role: 'user', content: text });
      try {
        const res = await fetch(server + '/api/projects/discovery/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: hist })
        });
        const d = await res.json();
        addMsg('👥 Hermes Studio', d.reply || 'Diterima.', 'agent');
        hist.push({ role: 'assistant', content: d.reply });
      } catch (e) {
        addMsg('⚠️ System', 'Koneksi gagal: ' + e.message, 'agent');
      }
    }
    function addMsg(s, t, r) {
      const c = document.getElementById('chat');
      const d = document.createElement('div');
      d.className = 'msg ' + r;
      d.innerHTML = '<div class="sender">' + s + '</div><div class="bubble">' + t.replace(/\\n/g, '<br>') + '</div>';
      c.appendChild(d);
      c.scrollTop = c.scrollHeight;
    }
  </script>
</body>
</html>
