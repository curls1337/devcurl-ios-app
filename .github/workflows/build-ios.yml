name: Build Mobile Apps (iOS IPA & Android APK)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          for app in /Applications/Xcode_16*.app /Applications/Xcode_15*.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build iOS Application (Release)
        run: |
          xcodebuild clean build \
            -project DevCurlAI.xcodeproj \
            -scheme DevCurlAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package into Sideloadable IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/DevCurlAI.app Payload/
          zip -r DevCurlAI.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevCurlAI-iOS-IPA
          path: DevCurlAI.ipa
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Android Release APK
        working-directory: ./android
        run: |
          gradle assembleRelease --no-daemon || gradle assembleDebug --no-daemon

      - name: Locate and Rename APK
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          cp "$APK_FILE" DevCurlAI.apk
          ls -lh DevCurlAI.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevCurlAI-Android-APK
          path: DevCurlAI.apk
          retention-days: 30

  publish-release:
    name: Publish Release (IPA & APK)
    needs: [build-ios, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: DevCurlAI-iOS-IPA
          path: ./artifacts-ios

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: DevCurlAI-Android-APK
          path: ./artifacts-android

      - name: Consolidate Binaries
        run: |
          cp ./artifacts-ios/DevCurlAI.ipa ./DevCurlAI.ipa
          cp ./artifacts-android/DevCurlAI.apk ./DevCurlAI.apk
          ls -lh DevCurlAI.ipa DevCurlAI.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: DevCurl AI Mobile Suite v1.1.${{ github.run_number }} (iOS & Android)
          body: |
            ## DevCurl AI — Professional Mobile Client (iOS & Android)
            Aplikasi mobile native resmi untuk Pak cURLdev:
            - **`DevCurlAI.ipa`**: iOS Sideload (ESign, Sideloadly, AltStore, Scarlet)
            - **`DevCurlAI.apk`**: Android Direct Install
            
            ### Fitur
            - Desain mobile profesional khusus (Apple HIG & Dark OLED)
            - Percakapan multi-turn & New Chat
            - Multi-Agent Switcher (Ubuntu Admin, PM, UI/UX, Frontend, Backend)
          draft: false
          prerelease: false
          files: |
            DevCurlAI.ipa
            DevCurlAI.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
