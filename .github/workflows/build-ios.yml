name: Build Mobile Apps (iOS IPA & Android APK)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          for app in /Applications/Xcode_16*.app /Applications/Xcode_15*.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build iOS Application (Release)
        run: |
          xcodebuild clean build \
            -project DevCurlAI.xcodeproj \
            -scheme DevCurlAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package into Sideloadable IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/DevCurlAI.app Payload/
          zip -r DevCurlAI.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevCurlAI-iOS-IPA
          path: DevCurlAI.ipa
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Android Release APK
        working-directory: ./android
        run: |
          gradle assembleRelease --no-daemon || gradle assembleDebug --no-daemon

      - name: Locate and Rename APK
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          cp "$APK_FILE" DevCurlAI.apk
          ls -lh DevCurlAI.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevCurlAI-Android-APK
          path: DevCurlAI.apk
          retention-days: 30

  publish-release:
    name: Publish Release (IPA & APK)
    needs: [build-ios, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: DevCurlAI-iOS-IPA
          path: ./artifacts-ios

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: DevCurlAI-Android-APK
          path: ./artifacts-android

      - name: Consolidate Binaries
        run: |
          cp ./artifacts-ios/DevCurlAI.ipa ./DevCurlAI.ipa
          cp ./artifacts-android/DevCurlAI.apk ./DevCurlAI.apk
          ls -lh DevCurlAI.ipa DevCurlAI.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Nik AI v2.0.${{ github.run_number }} (Pure Voice Assistant, 'Hai Nik' Wake Word & nik.5nod.com)
          body: |
            ## Nik AI v2.0 — Pure Native Voice Assistant (iOS & Android)
            Aplikasi suara murni native resmi untuk Pak cURLdev:
            - **`DevCurlAI.ipa`**: iOS Sideload (ESign, Scarlet, AltStore, Sideloadly)
            - **`DevCurlAI.apk`**: Android Direct Install
            
            ### Fitur Utama v2.0:
            - 🎙️ **Pure Voice UI/UX**: Zero chat bloat. Dynamic OLED Neural Orb dengan visualisasi suara real-time.
            - 🗣️ **Wake Word ("Hai Nik")**: Panggil "Hai Nik" atau sentuh bola untuk mulai mendengarkan secara otomatis.
            - 🌐 **Direct Cloudflare Domain**: Langsung terhubung ke `https://nik.5nod.com` (Hermes API Gateway).
            - ⚡ **Full Automation**: Perintah suara untuk eksekusi server, chat WA, Telegram, video Remotion, dan tools multi-agent.
          draft: false
          prerelease: false
          files: |
            DevCurlAI.ipa
            DevCurlAI.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
