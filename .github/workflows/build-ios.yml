name: Build iOS Native IPA (Sideload Ready)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          for app in /Applications/Xcode_16*.app /Applications/Xcode_15*.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build iOS Application (Release)
        run: |
          xcodebuild clean build \
            -project DevCurlAI.xcodeproj \
            -scheme DevCurlAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package into Sideloadable IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/DevCurlAI.app Payload/
          zip -r DevCurlAI.ipa Payload

      - name: Upload IPA as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevCurlAI-iOS-IPA
          path: DevCurlAI.ipa
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DevCurl AI iOS Sideload v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: DevCurlAI.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
